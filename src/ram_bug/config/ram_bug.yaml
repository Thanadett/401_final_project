# RAM-Bug node parameters (TurtleBot3 Burger, ROS 2 Jazzy). Units: metres, radians, seconds.
ram_bug:
  ros__parameters:
    # competition rules
    capture_r: 0.30          # caught when centres are this close
    time_limit: 0.0          # s; stop after this long (time up = draw), 0 = no limit
    # planner
    algorithm: bug2          # bug2 = M-line + wall following + LiDAR moving-object avoidance / ram_bug
    avoid_r: 1.2             # m; (bug2) a moving object this close -> AVOID: step away, still toward the goal
    avoid_exit: 1.4          # m; (bug2) back to Bug2 with a new M-line once it is this far
    # driving
    max_lin: 0.20            # m/s  (Burger max 0.22; the planner assumes 0.2 m/s)
    max_ang: 2.5             # rad/s (Burger max 2.84)
    flee_lin: 0.22           # m/s while running from the chaser (Bug2 AVOID / RUSH)
    flee_clear: 0.35         # m; ... only with this much room in front (else max_lin): faster scraped boxes
    drive: smooth            # smooth = curve into turns (spin only if the target is > spin_deg behind) / spin
    spin_deg: 110.0          # (smooth) turn on the spot only when the target is further round than this
    curve_w: 1.8             # rad/s; (smooth) turn rate while curving
    curve_v: 0.25            # (smooth) keep at least this fraction of max_lin while curving
    slow_dist: 0.35          # m; (smooth) something closer in front -> turn tight like spin
    acc_lin: 0.5             # m/s^2; (smooth) acceleration limit (braking is 2x)
    acc_ang: 6.0             # rad/s^2
    calm_r: 2.0              # m; chaser closer than this (or AVOID/EVADE/...) -> drive like spin
    k_ang: 3.0               # heading gain
    lookahead_cells: 3       # aim this many 0.1 m cells ahead on the path
    min_aim: 0.25            # never aim closer than this (m): avoids stop-and-go on short paths
    smooth_deg: 15.0         # only average the target over changes smaller than this (deg)
    stop_dist: 0.17          # m from the LDS; the Burger's front edge is 0.07 m ahead of it (~10 cm gap)
    stuck_time: 2.0          # no progress for this long -> back up and turn
    blocked_time: 0.5        # held by stop_dist this long -> back up and turn toward the target side
    # map / perception
    inflate_cells: 1         # grow obstacles by 0.1 m for the robot body
    robot_max_cells: 4       # a LiDAR blob this small (cells) can be the other robot
    robot_max_extent: 3      # ... and at most this wide (cells, 0.3 m)
    motion_min_free: 2       # a cell must be seen empty this many scans before "it moved there"
    detect_chaser: lidar     # lidar / off  (off = drive to the goal ignoring any chaser, for testing)
    turn_gate: 0.6           # rad/s; LiDAR scans taken while turning faster are ignored (smeared)
    forget_ticks: 12         # forget a LiDAR chaser estimate not seen for 12 plans (6 s)
    motion_confirm: true     # a "moving" blob must be seen in 2 scans in a row, away from boxes
    laser_x_offset: -0.032   # LDS position behind base_footprint
    max_free_range: 3.0
    # loops
    plan_period: 0.5         # RAM-Bug decision rate (matches the simulator tick)
    control_period: 0.05
    cmd_vel_stamped: auto    # auto / true / false
    params_file: ""          # empty = share/ram_bug/config/best_params.json
    autostart: true
    # position sharing
    use_peer: true           # use the chaser pose from peer_link_node when it is fresh
    peer_timeout: 0.6        # s; older -> fall back to finding the chaser with LiDAR
    plan_margin: 0.0         # m added to capture_r when planning (tested 0.1-0.3: no gain in sim)
